<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Cloud Browser</title>
    <link rel="stylesheet" href="/src/popup.css" />
  </head>
  <body>
    <header>
      <span>☁</span>
      <div>
        <h1>Cloud Browser</h1>
        <p>你的浏览器，随处继续。</p>
      </div>
    </header>
    <button id="continue" class="primary">打开我的云浏览器 ↗</button
    ><button id="open">在云端打开当前页面 ↗</button>
    <p id="message" role="status"></p>
    <details id="settings">
      <summary>服务器设置</summary>
      <form id="server-form">
        <label for="server">Cloud Browser 地址</label
        ><input
          id="server"
          type="url"
          placeholder="https://browser.example.com"
          required
        /><button type="submit">保存地址</button>
      </form>
    </details>
    <footer>登录在网页中完成 · 插件不保存密码</footer>
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
