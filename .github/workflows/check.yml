name: check
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: cloudbrowser
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: "1.25.x" }
      - uses: actions/setup-node@v5
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run build && npm test
      - run: go test -race ./...
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/cloudbrowser?sslmode=disable
      - run: go vet ./...
      - run: npx playwright install --with-deps chromium
      - run: npm run test:extension
      - run: docker compose -f compose.yaml -f compose.database.yaml config --quiet
        env:
          DOMAIN: browser.example.test
          DATABASE_URL: postgres://cloudbrowser:test@postgres:5432/cloudbrowser?sslmode=disable
          POSTGRES_DB: cloudbrowser
          POSTGRES_USER: cloudbrowser
          POSTGRES_PASSWORD: test
      - run: bash -n scripts/*.sh deploy/browser/*.sh
